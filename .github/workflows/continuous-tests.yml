name: Continuous Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read

concurrency:
  group: continuous-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-audio-diagnostics:
    name: Linux host audio diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend detector
        run: pnpm --filter @loopwire/audio-host build

      - name: Run host diagnostics
        run: bash scripts/ct-host-check.sh | tee "$RUNNER_TEMP/loopwire-host-audio-diagnostics.txt"

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: loopwire-host-audio-diagnostics
          path: ${{ runner.temp }}/loopwire-host-audio-diagnostics.txt
          retention-days: 14
