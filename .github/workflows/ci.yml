name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install Tauri check dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xauth \
            xvfb \
            rpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check

  validate-aur-source:
    name: Build source AUR package on Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Build and inspect source package
        run: |
          set -euo pipefail
          release_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          export LOOPWIRE_AUR_VERSION="${release_tag#v}"
          docker run --rm \
            --env LOOPWIRE_AUR_VERSION \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            archlinux@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6 \
            bash -ceu '
              pacman -Syu --noconfirm --needed \
                curl git namcap nodejs pipewire pnpm rust webkit2gtk-4.1 wireplumber
              useradd --create-home aur-builder
              runuser -u aur-builder -- env HOME=/home/aur-builder \
                bash /workspace/scripts/verify-aur-source-package.sh \
                  --version "$LOOPWIRE_AUR_VERSION"
            '
