name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "apps/desktop/**"
      - "packages/**"
      - "packaging/**"
      - "scripts/**"
      - "vm/**"
      - "flake.nix"
      - "flake.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".npmrc"
      - "!**/*.md"
      - "!scripts/*docs*"
      - "!scripts/build-static-site.mjs"
      - "!scripts/verify-static-site.mjs"
      - "!scripts/e2e-site-install.mjs"
      - "!scripts/verify-github-workflows.sh"
      - "!scripts/verify-requirements.sh"
      - "!scripts/setup-github-actions.mjs"
      - "!scripts/test-setup-github-actions.mjs"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/ci.yml"
      - "apps/desktop/**"
      - "packages/**"
      - "packaging/**"
      - "scripts/**"
      - "vm/**"
      - "flake.nix"
      - "flake.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".npmrc"
      - "!**/*.md"
      - "!scripts/*docs*"
      - "!scripts/build-static-site.mjs"
      - "!scripts/verify-static-site.mjs"
      - "!scripts/e2e-site-install.mjs"
      - "!scripts/verify-github-workflows.sh"
      - "!scripts/verify-requirements.sh"
      - "!scripts/setup-github-actions.mjs"
      - "!scripts/test-setup-github-actions.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Check affected inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Check paths and dependency impact
        run: ruby scripts/ci-impact.rb application .github/workflows/ci.yml

  validate:
    name: Validate workspace
    needs: changes
    if: needs.changes.outputs.run == 'true'
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install Tauri check dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xauth \
            xvfb \
            rpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check
