name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify docs contract
        run: pnpm verify:docs

      - name: Build docs
        run: pnpm build:docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: loopwire-docs
          path: apps/docs/docs/.vitepress/dist

  deploy-bunny:
    name: Deploy to Bunny.net
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: docs-production
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify docs contract
        run: pnpm verify:docs

      - name: Build docs
        run: pnpm build:docs

      - name: Check Bunny.net secrets
        id: bunny
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_REMOTE_PREFIX: ${{ secrets.BUNNY_REMOTE_PREFIX }}
          BUNNY_PULL_ZONE_HOSTNAME: ${{ secrets.BUNNY_PULL_ZONE_HOSTNAME }}
        run: |
          set -euo pipefail
          if [ -n "${BUNNY_STORAGE_ZONE:-}" ] && [ -n "${BUNNY_ACCESS_KEY:-}" ]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::Bunny.net secrets are not configured; skipping deployment."
            echo "::notice::Create a local no-value secret template with: bash scripts/setup-github-secrets.sh --write-env-template /secure/loopwire-release-secrets.env"
            echo "::notice::Fill it locally, then set repository secrets with: bash scripts/setup-github-secrets.sh --repo ${GITHUB_REPOSITORY} --env-file /secure/loopwire-release-secrets.env"
            echo "::notice::For final proof, include BUNNY_PULL_ZONE_HOSTNAME in that env file so live-docs smoke can run."
            echo "deploy=false" >>"$GITHUB_OUTPUT"
          fi
          if [ -n "${BUNNY_PULL_ZONE_HOSTNAME:-}" ]; then
            echo "hostname=true" >>"$GITHUB_OUTPUT"
          else
            echo "hostname=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload files to Bunny.net storage
        if: ${{ steps.bunny.outputs.deploy == 'true' }}
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_REMOTE_PREFIX: ${{ secrets.BUNNY_REMOTE_PREFIX }}
          LOOPWIRE_DOCS_DEPLOYMENT_MANIFEST: dist/docs-deployment/deployment-manifest.json
        run: bash scripts/deploy-docs-bunny.sh --dist apps/docs/docs/.vitepress/dist

      - name: Verify docs deployment manifest
        if: ${{ steps.bunny.outputs.deploy == 'true' }}
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_REMOTE_PREFIX: ${{ secrets.BUNNY_REMOTE_PREFIX }}
        run: |
          pnpm verify:docs-deployment -- \
            --manifest dist/docs-deployment/deployment-manifest.json \
            --dist apps/docs/docs/.vitepress/dist \
            --storage-zone "$BUNNY_STORAGE_ZONE" \
            --storage-endpoint "${BUNNY_STORAGE_ENDPOINT:-https://storage.bunnycdn.com}" \
            --remote-prefix "$BUNNY_REMOTE_PREFIX" \
            --git-head "$GITHUB_SHA" \
            --expected-dry-run false

      - name: Upload docs deployment manifest
        if: ${{ steps.bunny.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: loopwire-docs-deployment
          path: dist/docs-deployment/deployment-manifest.json

      - name: Report pull-zone hostname
        if: ${{ steps.bunny.outputs.deploy == 'true' && steps.bunny.outputs.hostname == 'true' }}
        env:
          BUNNY_PULL_ZONE_HOSTNAME: ${{ secrets.BUNNY_PULL_ZONE_HOSTNAME }}
          BUNNY_REMOTE_PREFIX: ${{ secrets.BUNNY_REMOTE_PREFIX }}
        run: |
          bash scripts/verify-docs-live.sh \
            --hostname "$BUNNY_PULL_ZONE_HOSTNAME" \
            --remote-prefix "$BUNNY_REMOTE_PREFIX"

          docs_url="https://${BUNNY_PULL_ZONE_HOSTNAME}"
          prefix="${BUNNY_REMOTE_PREFIX#/}"
          prefix="${prefix%/}"
          if [ -n "$prefix" ]; then
            docs_url="${docs_url}/${prefix}"
          fi
          echo "Docs deployed to ${docs_url}"
