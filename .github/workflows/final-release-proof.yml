name: Final Release Proof
run-name: Final Release Proof ${{ inputs.tag }} @ ${{ inputs.git_head }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to verify
        required: true
        type: string
      git_head:
        description: Expected 40-character commit SHA for the release tag
        required: true
        type: string
      docs_base_url:
        description: Live docs base URL, for example https://docs.example.test/loopwire
        required: false
        type: string
      docs_hostname:
        description: Bunny pull-zone hostname override; defaults to BUNNY_PULL_ZONE_HOSTNAME
        required: false
        type: string
      docs_remote_prefix:
        description: Optional Bunny remote prefix override; defaults to BUNNY_REMOTE_PREFIX
        required: false
        type: string
      docs_deployment_run_id:
        description: GitHub Actions run id for the docs deployment that uploaded loopwire-docs-deployment
        required: true
        type: string
      docs_deployment_artifact:
        description: Docs deployment artifact name containing deployment-manifest.json
        required: false
        type: string
      release_evidence_asset:
        description: Release asset containing release evidence
        required: false
        type: string
      vm_evidence_asset:
        description: Release asset containing all target VM evidence
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: final-release-proof-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-final-release-proof:
    name: Verify final release proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOPWIRE_RELEASE_TAG_INPUT: ${{ inputs.tag }}
      LOOPWIRE_RELEASE_COMMIT_INPUT: ${{ inputs.git_head }}
      LOOPWIRE_DOCS_BASE_URL_INPUT: ${{ inputs.docs_base_url }}
      LOOPWIRE_DOCS_HOSTNAME_INPUT: ${{ inputs.docs_hostname }}
      LOOPWIRE_DOCS_HOSTNAME_SECRET: ${{ vars.BUNNY_PULL_ZONE_HOSTNAME || secrets.BUNNY_PULL_ZONE_HOSTNAME }}
      LOOPWIRE_DOCS_REMOTE_PREFIX_INPUT: ${{ inputs.docs_remote_prefix }}
      LOOPWIRE_DOCS_REMOTE_PREFIX_SECRET: ${{ vars.BUNNY_REMOTE_PREFIX || secrets.BUNNY_REMOTE_PREFIX }}
      LOOPWIRE_DOCS_DEPLOYMENT_RUN_ID_INPUT: ${{ inputs.docs_deployment_run_id }}
      LOOPWIRE_DOCS_DEPLOYMENT_ARTIFACT_INPUT: ${{ inputs.docs_deployment_artifact }}
      LOOPWIRE_RELEASE_EVIDENCE_ASSET_INPUT: ${{ inputs.release_evidence_asset }}
      LOOPWIRE_VM_EVIDENCE_ASSET_INPUT: ${{ inputs.vm_evidence_asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.2

      - name: Resolve release tag
        run: |
          set -euo pipefail
          release_tag="$LOOPWIRE_RELEASE_TAG_INPUT"
          release_commit="$LOOPWIRE_RELEASE_COMMIT_INPUT"
          tag_pattern='^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ ! "$release_tag" =~ $tag_pattern ]]; then
            echo "Release tag must be v-prefixed semver without path separators: ${release_tag}" >&2
            exit 1
          fi
          if [[ ! "$release_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release commit must be a 40-character SHA: ${release_commit}" >&2
            exit 1
          fi
          if ! git check-ref-format --allow-onelevel "$release_tag"; then
            echo "Release tag is not a valid git tag name: ${release_tag}" >&2
            exit 1
          fi
          git fetch --force --tags
          tag_ref="refs/tags/${release_tag}"
          if ! tag_commit="$(git rev-parse -q --verify "${tag_ref}^{commit}")"; then
            echo "Release tag does not exist in this checkout: ${release_tag}" >&2
            exit 1
          fi
          if [ "$tag_commit" != "$release_commit" ]; then
            echo "Release tag ${release_tag} points at ${tag_commit}, not ${release_commit}" >&2
            exit 1
          fi
          git checkout --detach "$release_commit"
          printf 'LOOPWIRE_RELEASE_TAG=%s\n' "$release_tag" >>"$GITHUB_ENV"
          printf 'LOOPWIRE_RELEASE_COMMIT=%s\n' "$release_commit" >>"$GITHUB_ENV"

      - name: Validate live docs target
        run: |
          set -euo pipefail
          docs_hostname="$LOOPWIRE_DOCS_HOSTNAME_INPUT"
          docs_remote_prefix="$LOOPWIRE_DOCS_REMOTE_PREFIX_INPUT"
          if [ -n "$LOOPWIRE_DOCS_BASE_URL_INPUT" ] && [ -n "$docs_hostname" ]; then
            echo "Use either docs_base_url or docs_hostname, not both." >&2
            exit 1
          fi
          if [ -z "$LOOPWIRE_DOCS_BASE_URL_INPUT" ]; then
            if [ -z "$docs_hostname" ]; then
              docs_hostname="$LOOPWIRE_DOCS_HOSTNAME_SECRET"
            fi
            if [ -z "$docs_remote_prefix" ]; then
              docs_remote_prefix="$LOOPWIRE_DOCS_REMOTE_PREFIX_SECRET"
            fi
          fi
          if [ -z "$LOOPWIRE_DOCS_BASE_URL_INPUT" ] && [ -z "$docs_hostname" ]; then
            echo "Final release proof requires docs_base_url, docs_hostname, or BUNNY_PULL_ZONE_HOSTNAME." >&2
            exit 1
          fi
          printf 'LOOPWIRE_FINAL_DOCS_HOSTNAME=%s\n' "$docs_hostname" >>"$GITHUB_ENV"
          printf 'LOOPWIRE_FINAL_DOCS_REMOTE_PREFIX=%s\n' "$docs_remote_prefix" >>"$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download docs deployment manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docs_run_id="$LOOPWIRE_DOCS_DEPLOYMENT_RUN_ID_INPUT"
          artifact="${LOOPWIRE_DOCS_DEPLOYMENT_ARTIFACT_INPUT:-loopwire-docs-deployment}"
          if [[ ! "$docs_run_id" =~ ^[0-9]+$ ]]; then
            echo "Docs deployment run id must be numeric: ${docs_run_id}" >&2
            exit 1
          fi
          bash scripts/verify-workflow-run.sh \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$docs_run_id" \
            --git-head "$LOOPWIRE_RELEASE_COMMIT" \
            --label "Deploy Docs workflow run"
          mkdir -p dist/final-proof/docs-deployment
          gh run download "$docs_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" \
            --dir dist/final-proof/docs-deployment
          mapfile -t manifests < <(
            find dist/final-proof/docs-deployment -type f -name deployment-manifest.json | sort
          )
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one deployment-manifest.json in docs deployment artifact." >&2
            exit 1
          fi
          printf 'LOOPWIRE_FINAL_DOCS_DEPLOYMENT_MANIFEST=%s\n' "${manifests[0]}" >>"$GITHUB_ENV"

      - name: Download signed checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/final-proof/downloads
          gh release download "$LOOPWIRE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/final-proof/downloads \
            --pattern SHA256SUMS \
            --clobber
          gh release download "$LOOPWIRE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/final-proof/downloads \
            --pattern SHA256SUMS.sig \
            --clobber

      - name: Download release evidence archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${LOOPWIRE_RELEASE_EVIDENCE_ASSET_INPUT:-}"
          if [ -z "$archive" ]; then
            archive="loopwire-release-evidence-${LOOPWIRE_RELEASE_TAG}.tar.gz"
          fi
          archive="$(
            bash scripts/validate-release-asset-name.sh \
              --kind release-evidence \
              --tag "$LOOPWIRE_RELEASE_TAG" \
              --asset "$archive"
          )"
          mkdir -p dist/final-proof/downloads dist/final-proof/release-evidence
          gh release download "$LOOPWIRE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/final-proof/downloads \
            --pattern "$archive" \
            --clobber
          bash scripts/verify-release-asset-checksum.sh \
            --release-dir dist/final-proof/downloads \
            --asset "$archive" \
            --public-key packaging/release-signing-public.pem \
            --label "release evidence archive"
          bash scripts/extract-safe-tar.sh \
            --archive "dist/final-proof/downloads/${archive}" \
            --output-dir dist/final-proof/release-evidence \
            --label "release evidence archive"
          release_evidence_dir="dist/final-proof/release-evidence/${LOOPWIRE_RELEASE_TAG}"
          if [ ! -f "${release_evidence_dir}/release-evidence.json" ]; then
            echo "Release evidence archive must contain ${LOOPWIRE_RELEASE_TAG}/release-evidence.json" >&2
            exit 1
          fi
          printf 'LOOPWIRE_FINAL_RELEASE_EVIDENCE_ASSET=%s\n' "$archive" >>"$GITHUB_ENV"
          printf 'LOOPWIRE_FINAL_RELEASE_EVIDENCE_DIR=%s\n' "$release_evidence_dir" >>"$GITHUB_ENV"

      - name: Download VM evidence archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${LOOPWIRE_VM_EVIDENCE_ASSET_INPUT:-}"
          if [ -z "$archive" ]; then
            archive="loopwire-vm-evidence-${LOOPWIRE_RELEASE_TAG}.tar.gz"
          fi
          archive="$(
            bash scripts/validate-release-asset-name.sh \
              --kind vm-evidence \
              --tag "$LOOPWIRE_RELEASE_TAG" \
              --asset "$archive"
          )"
          mkdir -p dist/final-proof/downloads dist/final-proof/vm-evidence
          gh release download "$LOOPWIRE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/final-proof/downloads \
            --pattern "$archive" \
            --clobber
          bash scripts/verify-release-asset-checksum.sh \
            --release-dir dist/final-proof/downloads \
            --asset "$archive" \
            --public-key packaging/release-signing-public.pem \
            --label "VM evidence archive"
          bash scripts/extract-safe-tar.sh \
            --archive "dist/final-proof/downloads/${archive}" \
            --output-dir dist/final-proof/vm-evidence \
            --label "VM evidence archive"
          vm_evidence_root="dist/final-proof/vm-evidence"
          if [ -d "${vm_evidence_root}/.vm/evidence" ]; then
            vm_evidence_root="${vm_evidence_root}/.vm/evidence"
          elif [ -d "${vm_evidence_root}/vm-evidence" ]; then
            vm_evidence_root="${vm_evidence_root}/vm-evidence"
          fi
          node scripts/verify-vm-evidence-archive-manifest.mjs \
            --manifest "${vm_evidence_root}/manifest.json" \
            --tag "$LOOPWIRE_RELEASE_TAG" \
            --targets-file vm/targets.tsv \
            --require-all-targets \
            --evidence-root "$vm_evidence_root" \
            --verify-bundles \
            --require-published-release
          printf 'LOOPWIRE_FINAL_VM_EVIDENCE_ASSET=%s\n' "$archive" >>"$GITHUB_ENV"
          printf 'LOOPWIRE_FINAL_VM_EVIDENCE_ROOT=%s\n' "$vm_evidence_root" >>"$GITHUB_ENV"

      - name: Verify final release proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --repo "$GITHUB_REPOSITORY"
            --tag "$LOOPWIRE_RELEASE_TAG"
            --public-key packaging/release-signing-public.pem
            --git-head "$LOOPWIRE_RELEASE_COMMIT"
            --release-evidence-dir "$LOOPWIRE_FINAL_RELEASE_EVIDENCE_DIR"
            --release-evidence-asset "$LOOPWIRE_FINAL_RELEASE_EVIDENCE_ASSET"
            --vm-evidence-asset "$LOOPWIRE_FINAL_VM_EVIDENCE_ASSET"
            --docs-deployment-manifest "$LOOPWIRE_FINAL_DOCS_DEPLOYMENT_MANIFEST"
            --vm-evidence-root "$LOOPWIRE_FINAL_VM_EVIDENCE_ROOT"
            --support-matrix apps/docs/docs/guide/support-matrix.md
          )
          if [ -n "$LOOPWIRE_DOCS_BASE_URL_INPUT" ]; then
            args+=(--docs-base-url "$LOOPWIRE_DOCS_BASE_URL_INPUT")
          else
            args+=(--docs-hostname "$LOOPWIRE_FINAL_DOCS_HOSTNAME")
            if [ -n "$LOOPWIRE_FINAL_DOCS_REMOTE_PREFIX" ]; then
              args+=(--docs-remote-prefix "$LOOPWIRE_FINAL_DOCS_REMOTE_PREFIX")
            fi
          fi
          bash scripts/verify-final-release-proof.sh "${args[@]}"
