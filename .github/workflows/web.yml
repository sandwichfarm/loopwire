name: Web and Docs

on:
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "apps/site/**"
      - "packaging/repositories/apt-channel.json"
      - "apps/docs/**"
      - "assets/product-screenshot.png"
      - "README.md"
      - "packaging/README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".npmrc"
      - "scripts/ci-impact.rb"
      - "scripts/test-ci-impact.rb"
      - "scripts/test-ci-workflow-paths.rb"
      - "scripts/install.sh"
      - "scripts/build-static-site.mjs"
      - "scripts/verify-static-site.mjs"
      - "scripts/e2e-site-install.mjs"
      - "scripts/verify-docs.sh"
      - "scripts/verify-support-matrix.mjs"
      - "scripts/verify-vm-evidence.sh"
      - "vm/targets.tsv"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/web.yml"
      - "apps/site/**"
      - "packaging/repositories/apt-channel.json"
      - "apps/docs/**"
      - "assets/product-screenshot.png"
      - "README.md"
      - "packaging/README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".npmrc"
      - "scripts/ci-impact.rb"
      - "scripts/test-ci-impact.rb"
      - "scripts/test-ci-workflow-paths.rb"
      - "scripts/install.sh"
      - "scripts/build-static-site.mjs"
      - "scripts/verify-static-site.mjs"
      - "scripts/e2e-site-install.mjs"
      - "scripts/verify-docs.sh"
      - "scripts/verify-support-matrix.mjs"
      - "scripts/verify-vm-evidence.sh"
      - "vm/targets.tsv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Check affected inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Check paths and dependency impact
        run: ruby scripts/ci-impact.rb web .github/workflows/web.yml

  validate-web:
    name: Validate website and docs
    needs: changes
    if: needs.changes.outputs.run == 'true'
    concurrency:
      group: web-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check website and docs types
        run: pnpm --filter @loopwire/site --filter @loopwire/docs typecheck
      - name: Check documentation contracts
        run: pnpm verify:docs && pnpm verify:requirements
      - name: Test documentation
        run: pnpm --filter @loopwire/docs test
      - name: Build and verify the static site
        run: pnpm build:web && pnpm verify:site
