name: Workflow Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci-impact.rb"
      - "scripts/test-ci-impact.rb"
      - "scripts/test-ci-workflow-paths.rb"
      - "scripts/test-apt-workflow.rb"
      - "scripts/test-fedora-workflow.rb"
      - "scripts/*native-package-proof-snapshot.mjs"
      - "scripts/verify-github-workflows.sh"
      - "scripts/verify-requirements.sh"
      - "scripts/*docs*"
      - "scripts/setup-github-actions.mjs"
      - "scripts/test-setup-github-actions.mjs"
      - ".planning/REQUIREMENTS.md"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/**"
      - "scripts/ci-impact.rb"
      - "scripts/test-ci-impact.rb"
      - "scripts/test-ci-workflow-paths.rb"
      - "scripts/test-apt-workflow.rb"
      - "scripts/test-fedora-workflow.rb"
      - "scripts/*native-package-proof-snapshot.mjs"
      - "scripts/verify-github-workflows.sh"
      - "scripts/verify-requirements.sh"
      - "scripts/*docs*"
      - "scripts/setup-github-actions.mjs"
      - "scripts/test-setup-github-actions.mjs"
      - ".planning/REQUIREMENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contracts:
    name: Validate workflow and automation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.3.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check workflow routing and contracts
        run: pnpm verify:workflows && pnpm verify:requirements
      - name: Test automation with isolated fixtures
        run: pnpm test:setup-github && pnpm verify:scripts
