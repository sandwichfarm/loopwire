# Include these locations in a TLS-enabled server, with an operator-provisioned
# certificate and server_name. The SSH publisher writes to /srv/loopwire-apt;
# only its public child may be served. snapshots/ and state/ stay private.
# Give the HTTP account read/traverse access to public, never origin write access.
root /srv/loopwire-apt/public;
autoindex off;
disable_symlinks on;

# Interrupted same-filesystem writes may leave hidden temporary files.
location ~ (^|/)\. {
    deny all;
}

location ~ "^/(pool/.+\.deb|dists/[^/]+/main/binary-amd64/by-hash/SHA256/[0-9a-f]{64}|keys/[A-F0-9]+\.asc)$" {
    try_files $uri =404;
    error_page 404 = @apt_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location @apt_missing {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 404;
}

# Never cache metadata or missing-file responses at an origin/CDN. InRelease is
# atomic per suite; clients use Acquire-By-Hash for indexes referenced by it.
location / {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    etag off;
}
