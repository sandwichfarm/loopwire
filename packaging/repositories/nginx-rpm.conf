# Include these locations in a TLS-enabled server. The SSH publisher writes to
# /srv/loopwire-rpm; only its public child is served. snapshots/ and state/ stay
# private. The DNF base URL is https://HOST/fedora/44/x86_64/.
root /srv/loopwire-rpm/public;
autoindex off;
disable_symlinks on;

# Interrupted same-filesystem writes may leave hidden temporary files.
location ~ (^|/)\. {
    deny all;
}

# Package, fingerprinted key, and checksum-named repodata URLs never change.
# Old objects remain reachable so clients that cached an older repomd.xml can
# finish after a publication or rollback.
location ~ "^/fedora/44/x86_64/(packages/loopwire-[A-Za-z0-9][A-Za-z0-9.+_~]*-1\.fc44\.x86_64\.rpm|keys/([A-F0-9]{40}|[A-F0-9]{64})\.asc|repodata/[0-9a-f]{64}-(primary|filelists|other)\.xml\.gz)$" {
    try_files $uri =404;
    error_page 404 = @rpm_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location @rpm_missing {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 404;
}

# repomd.xml is the commit point. The publisher atomically replaces its
# detached signature first and repomd.xml last. Never cache either file: a
# request sequence that crosses publication fails closed under repo_gpgcheck=1
# and a retry obtains the matched pair. No CDN-wide purge is required.
location /fedora/44/x86_64/ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    etag off;
}
